name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned image
        run: docker build -f docker/Dockerfile -t mmeia-crud-product-management:${{ github.sha }} .
      - name: Save image as artifact
        run: docker save mmeia-crud-product-management:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      # This project's declared deployment target is local Docker Compose
      # (see docs/deployment.md, spec.md) - there is no remote host to push
      # to. "Deploy" here means: the image that passed build+test is the
      # artifact an operator pulls and runs via `docker compose up`. A
      # future Reference Project with a real remote target (SaaS, API)
      # would replace this step with an actual push + remote deploy.
      - name: Confirm deployable image
        run: docker images mmeia-crud-product-management
